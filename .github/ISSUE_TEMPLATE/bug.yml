name: Something broke
description: The extension stopped finding items, or produced the wrong file
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Providers change their interfaces without warning, so "it worked last week"
        is a normal and useful report. The diagnostics block below tells us which
        tier dropped out, which is most of the diagnosis.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics block
      description: >
        Popup → `Diagnostics`. It copies provider, counts and what resolved to the
        clipboard. There is no telemetry in this extension, so this block is the
        only thing that tells us what your page looked like. Read it before
        pasting — it names the provider and the conversation title, nothing else.
      render: text
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: claude.ai
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      placeholder: |
        The conversation has 6 code blocks; the control says 2.
        The file downloaded as index.ts but the block is a Python script.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension and Chrome version
      placeholder: "1.0.0 / Chrome 131"
    validations:
      required: true
